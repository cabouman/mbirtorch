[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbirtorch"
# The version is single-sourced from mbirtorch/__init__.py (__version__); the
# release workflow checks the git tag against it, so bump it there only.
dynamic = ["version"]
description = "High-performance tomographic reconstruction using PyTorch"
keywords = ["tomography", "tomographic reconstruction", "computed tomography"]
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "MBIRTORCH development team", email = "buzzard@purdue.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.11"
dependencies = [
    # Pinning style: a FLOOR that advances deliberately, plus
    # known-bad exclusions as they are found (none yet).
    # Re-test on each torch bump via the metrics
    # harness backend cells before advancing it.
    "torch>=2.13",
    "numpy",
    # The slice viewer (mbirtorch/viewers/slice_figure.py) needs matplotlib
    # always, and h5py for HDF5 load/save (imported lazily, but required for
    # full function).
    "matplotlib",
    # Pillow writes the animated GIF of save_volume_as_gif.  matplotlib already
    # requires it, so this declares what is imported rather than adding a install.
    "pillow",
    "h5py",
    # The preprocess package needs scipy (filters, fitting), tifffile (scan
    # readers), tqdm (batch progress), and pywavelets (wavelet-FFT stripe
    # removal).  hsnt uses scipy.optimize for its L-BFGS-B solver, tifffile
    # for TIFF stacks, and tqdm for conversion progress.
    "scipy",
    "tifffile",
    "tqdm",
    "pywavelets",
    # Metal artifact reduction: osqp solves the constrained beam-hardening fit;
    # opencv-python provides the view-alignment ECC estimator and Gaussian filtering.
    "osqp",
    "opencv-python",
    # Vendor loaders: olefile parses Zeiss/Xradia OLE containers; gdown fetches
    # Google Drive-hosted demo datasets in download_and_extract.
    "olefile",
    "gdown",
    # The hsnt L2 baseline (l2_dehydrate): NMF and randomized SVD.
    "scikit-learn",
    # get_memory_stats reads host RSS/USS via psutil; the hsnt loaders check
    # available host memory with it.
    "psutil",
]

[project.scripts]
# hsnt from the shell: inspect / convert / dehydrate / rehydrate / denoise (mbirtorch/hsnt/cli.py).
mbirtorch-hsnt = "mbirtorch.hsnt.cli:main"

[project.optional-dependencies]

test = ["pytest", "pytest-xdist"]
docs = [
     "sphinx",
     "sphinxcontrib-bibtex",
     "sphinx-book-theme>=1.0.1",
     "sphinx-design",
     "sphinx-copybutton",
     "sphinxext-opengraph"
]


[tool.pytest.ini_options]
markers = [
    "performance: timing-gate tests; exclude with -m 'not performance' on loaded machines",
]

[tool.setuptools.dynamic]
# setuptools reads the attribute by PARSING the source, not importing it, so
# the environment-variable side effects at the top of __init__.py do not run
# at build time (the assignment must stay a plain string literal).
version = {attr = "mbirtorch.__version__"}

[tool.setuptools.packages]
# Restrict discovery to the mbirtorch package (same rationale as mbirjax: the TOML `find`
# defaults to namespaces=true, which would sweep __init__.py-less top-level dirs into the
# wheel).
find = {include = ["mbirtorch*"]}

[tool.setuptools.package-data]
# The spectra of the hsnt phantom, read by mbirtorch.hsnt.load_material_basis.
"mbirtorch.hsnt" = ["data/*.npy"]

[project.urls]
source = "https://github.com/cabouman/mbirtorch"
