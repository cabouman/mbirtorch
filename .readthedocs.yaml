# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS and Python version the build needs.
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      # Install the CPU-only torch wheel FIRST, so the `pip install .[docs]` below
      # sees the requirement already satisfied.  Without this, pip resolves `torch`
      # from PyPI, which on Linux is the CUDA build -- several GB of nvidia-* wheels
      # that exceed RTD's build disk and time limits.  Autodoc only needs to import
      # the package, so the CPU wheel is sufficient.
      #
      # RTD seeds the environment with an old pip that rejects wheels whose
      # metadata spells the name with an underscore (typing_extensions broke
      # the 2026-08-12 build), so upgrade pip first.
      - pip install --upgrade pip
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

# Build the Sphinx docs.
sphinx:
  configuration: docs/source/conf.py

# Install dependencies straight from pyproject.toml (the single source of truth):
# the package itself plus its optional "docs" extra. No conda / environment.yml.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
