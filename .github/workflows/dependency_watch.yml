name: Dependency watch
# The nightly watch (plans repo: plans/torch_port/active/
# python_matrix_nightly_check.md).  LIVE: on a divergence between torch's
# supported versions and ours, confirmed on two consecutive nights, it opens
# ONE pull request against prerelease with the exact edit, requests review
# from both maintainers (that is the email), and dispatches CI on the branch.
# A pull request in any state for the same divergence stands as the answer:
# nothing is opened twice, and closing one unmerged is a standing "no".
#
# GitHub runs scheduled workflows from the DEFAULT branch (main); the watch
# itself always reads and proposes against prerelease.

on:
  schedule:
    - cron: "13 9 * * *"    # nightly, 09:13 UTC
  workflow_dispatch:

# The three grants of the plan's design; the built-in token holds them for
# the life of one run and cannot touch workflow files.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the two-night state
        uses: actions/cache/restore@v4
        with:
          path: .watch-state
          key: dependency-watch-state-${{ github.run_id }}
          restore-keys: dependency-watch-state-
      - name: Run the watch
        id: watch
        run: |
          python ci/dependency_watch.py --act \
            --state .watch-state/last-divergence \
            --base-sha "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open the pull request
        if: steps.watch.outputs.act == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.watch.outputs.branch }}"
          # A pull request in any state for this branch is a standing answer.
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
                  --state all --json id --jq length)" != "0" ]; then
            echo "a pull request for $BRANCH already exists; nothing to do" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -a -m "${{ steps.watch.outputs.title }}"
          git push -f origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base prerelease \
            --head "$BRANCH" --title "${{ steps.watch.outputs.title }}" \
            --body-file "${{ steps.watch.outputs.body_path }}" \
            --reviewer cabouman --reviewer gbuzzard \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Save the two-night state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watch-state
          key: dependency-watch-state-${{ github.run_id }}
